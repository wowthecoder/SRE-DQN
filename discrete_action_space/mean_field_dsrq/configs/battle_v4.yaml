# Solver-free mean-field SRQ config for MAgent2 battle_v4
algorithm: mf_srq_lp
env_name: battle_v4
env_backend: magent2
map_size: 40
max_cycles: 400

# Two teams; agents named "red_N" and "blue_N".
type_prefixes:
  red: "red_"
  blue: "blue_"

# Neighbor action space defaults to the own action space for Battle teams.
mean_field_source: opponent

# Local mean-field SRE robustness
epsilon_robust_start: 0.10
epsilon_robust_end: 0.02
epsilon_robust_decay_frac: 1.0
robust_distance: tv
robust_lp_fallback: greedy_tv
robust_policy_cache_enabled: true
robust_policy_cache_size: 4096
robust_policy_cache_round_digits: 6

# Exploration schedule follows the mfrl-master Battle training script:
# 1.0 -> 0.2 over the first 80%, then 0.2 -> 0.1.
epsilon_explore_start: 1.0
epsilon_explore_mid: 0.2
epsilon_explore_mid_fraction: 0.8
epsilon_explore_end: 0.1

# Reference MFQ hyperparameters
gamma: 0.95
lr: 1.0e-4
batch_size: 64
buffer_capacity: 80000
learning_starts: 5000
train_every: 5
target_tau: 0.005
grad_clip: 10.0

# Training budget
target_episodes: 2000
num_envs: 16
seed: 42
self_play_tau: 0.01
max_train_batches_per_update:

# Logging
output_dir: discrete_action_space/mean_field_dsrq/runs
reward_log_interval: 100
save_every: 20

use_gpu: true
