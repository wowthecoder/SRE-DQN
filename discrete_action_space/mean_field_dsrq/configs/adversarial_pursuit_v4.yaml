# MF-DSRQ config for MAgent2 adversarial_pursuit_v4
env_name: adversarial_pursuit_v4
map_size: 45
max_cycles: 500

# Two types with different action spaces:
# predators have 13 actions, prey have 5 actions.
type_prefixes:
  predator: "predator_"
  prey: "prey_"

# Neighbor action space for each type.
# Predators observe predator neighbors (13 actions).
# Prey observe prey neighbors (5 actions).
# Asymmetric: specify overrides explicitly.
n_nbr_actions_override:
  predator: 13
  prey: 5

# TV robustness
epsilon_tv_start: 0.10
epsilon_tv_end: 0.02
epsilon_tv_decay_frac: 1.0

# Boltzmann temperature
beta_start: 1.0
beta_end: 5.0
beta_anneal_frac: 0.5

# Exploration
epsilon_explore_start: 1.0
epsilon_explore_end: 0.05
epsilon_explore_decay_frac: 0.2

# RL
gamma: 0.95
lr: 1.0e-4
batch_size: 128
buffer_capacity: 500000
learning_starts: 5000
train_every: 4
target_tau: 0.005
grad_clip: 10.0
ema_momentum: 0.5

# Training budget
total_steps: 500000
num_envs: 8
seed: 42

# Logging
output_dir: runs
log_interval: 5000
save_interval: 50000

use_gpu: true
